<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>异世界种田</title>
<link id="styleCss" rel="stylesheet" href="css/style.css">
<script>
// css 同样带时间戳：GitHub Pages 的 max-age=600 内拿到的也可能不是最新，统一在这里破缓存
// （顺便兜底 no-cache 提示；index.html 本身 GH Pages 只缓存 10 分钟，之后必然拿到新版）
document.getElementById('styleCss').href = 'css/style.css?v=' + Date.now();
</script>
</head>
<body>
<canvas id="game"></canvas>
<script>window.__errors=[];window.addEventListener('error',function(e){window.__errors.push(e.message);});</script>
<script>
// 开发期：资源地址带时间戳，避免浏览器缓存旧文件
(function () {
  var files = [
    'js/i18n.js', 'js/lang/zh-CN.js', 'js/lang/en-US.js',
    'js/data/config.js', 'js/data/items.js', 'js/data/world.js',
    'js/game/state.js', 'js/game/vitals.js', 'js/game/actions.js', 'js/game/factory.js', 'js/game/battle.js', 'js/game/quest.js', 'js/game/dialog.js', 'js/game/cheat.js',
    'js/ui.js',
    'js/scenes/nodes.js', 'js/scenes/enemies.js', 'js/scenes/menu.js', 'js/scenes/field.js', 'js/scenes/panels.js', 'js/scenes/battle.js', 'js/scenes/factory.js',
    'js/main.js',
  ];
  for (var i = 0; i < files.length; i++) {
    document.write('<script src="' + files[i] + '?v=' + Date.now() + '"></scr' + 'ipt>');
  }
})();
</script>
</body>
</html>
